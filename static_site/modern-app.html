<script id="domextra-menu-overlay-fix-js">
(function(){
  function init(){
    var header=document.querySelector('header.site-header');
    if(!header)return;
    var button=header.querySelector('.mobile-menu');
    var source=header.querySelector('nav.desktop-nav');
    if(!button||!source)return;
    if(document.getElementById('domextra-mobile-menu-overlay'))return;
    var overlay=document.createElement('div');
    overlay.id='domextra-mobile-menu-overlay';
    overlay.innerHTML='<div class="domextra-menu-panel" role="dialog" aria-modal="true" aria-label="Glavni meni"><button type="button" class="domextra-menu-close" aria-label="Zatvori meni">×</button><div class="domextra-menu-brand">DOM EXTRA</div><nav aria-label="Glavna navigacija"></nav></div>';
    var dest=overlay.querySelector('nav');
    Array.prototype.forEach.call(source.querySelectorAll('a'),function(a){
      var copy=document.createElement('a');copy.href=a.getAttribute('href')||a.href;copy.textContent=(a.textContent||'').trim();
      if(copy.textContent)dest.appendChild(copy);
    });
    document.body.appendChild(overlay);
    var close=overlay.querySelector('.domextra-menu-close');
    function setOpen(open){
      overlay.classList.toggle('is-open',open);
      document.body.classList.toggle('domextra-menu-open',open);
      button.textContent=open?'×':'☰';
      button.setAttribute('aria-expanded',open?'true':'false');
      button.setAttribute('aria-label',open?'Zatvori meni':'Otvori meni');
    }
    button.type='button';button.setAttribute('aria-controls',overlay.id);setOpen(false);
    // Capture at document level so legacy handlers cannot interfere with the menu.
    document.addEventListener('click',function(e){
      if(e.target===button||button.contains(e.target)){
        e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();
        setOpen(!overlay.classList.contains('is-open'));
      }
    },true);
    close.addEventListener('click',function(){setOpen(false);});
    overlay.addEventListener('click',function(e){if(e.target===overlay)setOpen(false);});
    dest.addEventListener('click',function(e){if(e.target.closest('a'))setOpen(false);});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
